# deconflict configuration. Copy to ~/.config/deconflict/config.toml
# or run `deconflict --init-config` to write a default from this template.

[scan]
# Directories scanned recursively when no --dir is given.
default_dirs = []

# Pattern groups enabled by name (see PATTERNS in patterns.py + custom below).
enabled_patterns = ["nextcloud", "pacman", "syncthing"]

[general]
# Losers are moved here (OUTSIDE scan roots), never deleted.
backup_dir = "~/deconflict-backups"
# Per-file cache of scan results (path -> size/mtime/sha/is_text), keyed by dir set.
cache_dir = "~/.cache/deconflict"

[tools]
# External tools detected at runtime via shutil.which; per-OS defaults apply.
# Unset/empty = look up the default by name; set explicitly to override.
# diff = "meld"
# editor = "nvim"
# image_viewer = "eog"
# office = "soffice"
# keepass = "keepassxc-cli"
# mp3_editor = "kid3-cli"

[file_types]
# Which [tools] entry opens/edits each file kind (kinds: text, other, audio,
# image, video, office, kdbx). The interactive menu's (v)iew uses this.
# text = "editor"
# audio = "mp3_editor"
# image = "image_viewer"
# video = "viewer"
# office = "office"
# kdbx = "keepass"

# Custom regex conflict patterns. Base/winner semantics for each pattern:
#   base_name   - regex with exactly one capturing group: the base (non-conflict) name.
#   conflict_name - derived from base by the matcher unless overridden.
#   winner      - which side wins ("copy" or "base"); copy = local changes (Nextcloud).
[[scan.patterns]]
name = "example"
base_name = "(.+)\\.bak$"
winner = "copy"
