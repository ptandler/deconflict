[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deconflict"
version = "0.1.0"
description = "Interactive resolver for 'conflicted copy'-style sync conflict files (Nextcloud, pacman, Syncthing)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deconflict contributors" }]
keywords = ["nextcloud", "syncthing", "pacman", "conflict", "sync", "resolve"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "mutagen>=1.47",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
deconflict = "deconflict.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deconflict"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    "B008",   # Typer's idiomatic `typer.Option(...)` in defaults
    "UP042",  # str+Enum is intentional (Typer/JSON-friendly values)
]

[tool.ruff.lint.per-file-ignores]
"src/deconflict/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
