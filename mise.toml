[tools]
rust = "1.100.0"
python = "3.13"
uv = "latest"

[tasks.check]
description = "Format check + clippy + tests (CI does the same)"
run = [
    "cargo fmt --all -- --check",
    "cargo clippy --all-targets -- -D warnings",
    "cargo test --all-targets",
]

[tasks.python-check]
description = "Run the frozen Python reference checks"
run = "uv run --directory python --extra dev python -m pytest tests -q"

[tasks.build]
description = "Release build"
run = "cargo build --release"
