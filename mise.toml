[tools]
python = "3.13"
uv = "latest"

[tasks.format]
description = "Format"
run = [
    "uv run ruff format .",
    "uv run ruff check --fix",
]

[tasks.check]
description = "Lint + format-check + tests (CI does the same)"
run = [
#    "uv sync --extra dev", # done in CI setup (and local)
    "uv run ruff format --check .",
    "uv run ruff check .",
    "uv run pytest",
]

[tasks.version]
description = "Show and manage package versions"
run = "uv version"

[tasks.devenv]
description = "Install editable into global uv PATH for local testing"
run = "uv tool install --editable ."

[tasks.install]
description = "Install into global uv PATH"
run = "uv tool install ."
