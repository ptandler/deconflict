[package]
name = "deconflict-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deconflict"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
console = "0.16"
fancy-regex = "0.14"
image = "0.25.10"
indicatif = "0.18"
lofty = "0.25.5"
quick-xml = "0.39.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
